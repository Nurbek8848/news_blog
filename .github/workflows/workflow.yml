name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      DB_URL: postgresql://ci:ci@127.0.0.1:5432/articles_db
      REDIS_URL: redis://127.0.0.1:6379/1

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: articles_db
          POSTGRES_USER: ci
          POSTGRES_HOST: ci
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        cd source
        python manage.py test
